<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Signup</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<h2>ثبت نام</h2>

<input id="u" placeholder="username (6+)">
<input id="p" type="password" placeholder="password (6+)">

<button onclick="signup()">ثبت نام</button>
<button onclick="goLogin()">ورود</button>

<script>

const supabase = window.supabase.createClient(
"https://ctfkzshjeppxmckxgcxb.supabase.co",
"sb_publishable_4kdBgIgvDyU2Vd9u6N--Ng_3xpqZjMK"
);

async function signup(){
let u=document.getElementById("u").value;
let p=document.getElementById("p").value;

if(u.length<6||p.length<6){
alert("حداقل ۶ کاراکتر");
return;
}

await supabase.from("users").insert([
{username:u,password:p}
]);

alert("ثبت شد");
location.href="index.html";
}

function goLogin(){
location.href="index.html";
}

</script>

</body>
</html>
