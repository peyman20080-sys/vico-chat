<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Vico Chat (Supabase)</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #0b1220;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.chat {
  width: 380px;
  height: 600px;
  background: #111827;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: #2563eb;
  color: white;
  padding: 14px;
  text-align: center;
  font-weight: bold;
}

.messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.msg {
  padding: 8px 12px;
  border-radius: 10px;
  max-width: 70%;
  word-wrap: break-word;
}

.me {
  background: #22c55e;
  align-self: flex-end;
  color: black;
}

.friend {
  background: #374151;
  align-self: flex-start;
  color: white;
}

.input-box {
  display: flex;
  padding: 10px;
  background: #1f2937;
  gap: 8px;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  outline: none;
}

button {
  padding: 10px 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  color: white;
}

.meBtn { background: #22c55e; }
.friendBtn { background: #ef4444; }
</style>
</head>

<body>

<div class="chat">
  <div class="header">Vico Chat (Supabase)</div>

  <div class="messages" id="box"></div>

  <div class="input-box">
    <input id="text" placeholder="پیام بنویس..." />

    <button class="meBtn" onclick="send('me')">من</button>
    <button class="friendBtn" onclick="send('friend')">دوست</button>
  </div>
</div>

<script>
// 🔴 1. تنظیمات Supabase
const SUPABASE_URL = "https://peyman20080-sys.github.io/vico-chat/";
const SUPABASE_KEY = "sb_publishable_4kdBgIgvDyU2Vd9u6N--Ng_3xpqZjMK";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔴 2. گرفتن پیام‌ها
async function loadMessages() {
  let { data } = await supabase
    .from("messages")
    .select("*")
    .order("id", { ascending: true });

  render(data || []);
}

// 🔴 3. رندر پیام‌ها
function render(messages) {
  const box = document.getElementById("box");
  box.innerHTML = "";

  messages.forEach(m => {
    const div = document.createElement("div");
    div.classList.add("msg");
    div.classList.add(m.type);
    div.innerText = m.text;
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

// 🔴 4. ارسال پیام
async function send(type) {
  const input = document.getElementById("text");
  const text = input.value.trim();

  if (!text) return;

  await supabase.from("messages").insert([
    { text, type }
  ]);

  input.value = "";
}

// 🔴 5. Realtime (پیام لحظه‌ای)
supabase
  .channel("chat")
  .on(
    "postgres_changes",
    { event: "*", schema: "public", table: "messages" },
    () => loadMessages()
  )
  .subscribe();

// 🔴 6. شروع
loadMessages();
</script>

</body>
</html>
