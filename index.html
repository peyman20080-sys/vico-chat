<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vico Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:tahoma;
background:#111827;
color:white;
padding:20px;
}

.card{
background:#1f2937;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

#messages{
height:300px;
overflow:auto;
background:#0f172a;
padding:10px;
border-radius:10px;
margin-top:10px;
}
</style>
</head>
<body>

<h1>Vico Chat</h1>

<div class="card">
<h3>ثبت نام</h3>

<input id="username" placeholder="نام کاربری">
<input id="password" type="password" placeholder="رمز عبور">

<button onclick="register()">ثبت نام</button>
</div>

<div class="card">
<h3>ارسال پیام</h3>

<input id="receiver" placeholder="نام کاربری گیرنده">
<input id="message" placeholder="پیام">

<button onclick="sendMessage()">ارسال</button>

<div id="messages"></div>
</div>

<script>

const SUPABASE_URL = "https://ctfkzshjeppxmckxgcxb.supabase.co";
const SUPABASE_KEY = "sb_publishable_4kdBgIgvDyU2Vd9u6N--Ng_3xpqZjMK";

const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser="";

async function register(){

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

const {error}=await supabase
.from("users")
.insert([
{
username,
password
}
]);

if(error){
alert(error.message);
return;
}

currentUser=username;
alert("ثبت نام موفق");
}

async function sendMessage(){

const receiver=document.getElementById("receiver").value;
const message=document.getElementById("message").value;

const {error}=await supabase
.from("messages")
.insert([
{
sender:currentUser,
receiver,
message
}
]);

if(error){
alert(error.message);
return;
}

loadMessages();
}

async function loadMessages(){

const {data}=await supabase
.from("messages")
.select("*")
.order("id",{ascending:false})
.limit(50);

const box=document.getElementById("messages");

box.innerHTML=data
.map(x=>`<p><b>${x.sender}</b>: ${x.message}</p>`)
.join("");
}

setInterval(loadMessages,2000);

</script>

</body>
  </html>
