<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Vico Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #0f172a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.chat {
  width: 380px;
  height: 600px;
  background: #111827;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: #2563eb;
  color: white;
  padding: 12px;
  text-align: center;
  font-weight: bold;
}

.messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.msg {
  background: #374151;
  color: white;
  padding: 6px 10px;
  margin: 5px 0;
  border-radius: 8px;
}

.input-box {
  display: flex;
  padding: 10px;
  background: #1f2937;
  gap: 6px;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  outline: none;
}

button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  color: white;
  background: #22c55e;
}
</style>
</head>

<body>

<div class="chat">
  <div class="header">Vico Chat</div>

  <div class="messages" id="messages"></div>

  <div class="input-box">
    <input id="msg" placeholder="پیام بنویس..." />
    <button onclick="sendMsg()">ارسال</button>
  </div>
</div>

<script>
// 🔴 1. Supabase Config
const supabase = window.supabase.createClient(
  "https://peyman20080-sys.github.io/vico-chat/",
  "https://ctfkzshjeppxmckxgcxb.supabase.co"
);

// 🔴 کاربر فعلی (فعلاً دستی)
let currentUser = prompt("نام کاربری خودت رو وارد کن");

// 🔴 2. ارسال پیام
async function sendMsg() {
  let text = msg.value.trim();
  if (!text) return;

  await supabase.from("messages").insert([
    {
      sender: currentUser,
      receiver: "public",
      message: text
    }
  ]);

  msg.value = "";
  loadMessages();
}

// 🔴 3. گرفتن پیام‌ها
async function loadMessages() {
  let { data } = await supabase
    .from("messages")
    .select("*")
    .order("id", { ascending: true });

  messages.innerHTML = "";

  data.forEach(m => {
    messages.innerHTML += `
      <div class="msg">
        <b>${m.sender}:</b> ${m.message}
      </div>
    `;
  });

  messages.scrollTop = messages.scrollHeight;
}

// 🔴 4. realtime آپدیت
supabase
  .channel("chat")
  .on(
    "postgres_changes",
    { event: "*", schema: "public", table: "messages" },
    () => loadMessages()
  )
  .subscribe();

// 🔴 شروع
loadMessages();
</script>

</body>
</html>
