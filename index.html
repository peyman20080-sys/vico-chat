<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Vico Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  font-family: sans-serif;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  width: 360px;
  background: #111827;
  padding: 15px;
  border-radius: 12px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}

.chat { display: none; }

.msg {
  background: #374151;
  margin: 5px 0;
  padding: 6px;
  border-radius: 6px;
}
</style>
</head>

<body>

<!-- 🔵 ثبت نام / ورود -->
<div class="box" id="authBox">
  <h3>ثبت نام / ورود</h3>

  <input id="username" placeholder="نام کاربری (حداقل ۶)">
  <input id="password" type="password" placeholder="رمز (حداقل ۶)">

  <button onclick="register()">ثبت نام</button>
  <button onclick="login()">ورود</button>
</div>

<!-- 🟢 چت -->
<div class="box chat" id="chatBox">

  <h3>Vico Chat</h3>

  <input id="targetUser" placeholder="نام کاربری طرف مقابل">

  <div id="messages"></div>

  <input id="msg" placeholder="پیام...">
  <button onclick="sendMsg()">ارسال</button>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://ctfkzshjeppxmckxgcxb.supabase.co",
  "sb_publishable_4kdBgIgvDyU2Vd9u6N--Ng_3xpqZjMK"
);

let currentUser = null;

// 🔥 ثبت نام
async function register() {
  let u = username.value.trim();
  let p = password.value.trim();

  if (u.length < 6 || p.length < 6) {
    alert("حداقل ۶ کاراکتر لازم است");
    return;
  }

  await supabase.from("users").insert([
    { username: u, password: p }
  ]);

  alert("ثبت نام شد");
}

// 🔥 ورود
async function login() {
  let u = username.value.trim();
  let p = password.value.trim();

  let { data } = await supabase
    .from("users")
    .select("*")
    .eq("username", u)
    .eq("password", p);

  if (data.length > 0) {
    currentUser = u;
    authBox.style.display = "none";
    chatBox.style.display = "block";
    loadMessages();
  } else {
    alert("یافت نشد");
  }
}

// 🔥 ارسال پیام خصوصی
async function sendMsg() {
  let text = msg.value.trim();
  let receiver = targetUser.value.trim();

  if (!text || !receiver) return;

  await supabase.from("messages").insert([
    {
      sender: currentUser,
      receiver: receiver,
      message: text
    }
  ]);

  msg.value = "";
  loadMessages();
}

// 🔥 لود پیام‌های بین دو نفر
async function loadMessages() {
  let receiver = targetUser.value.trim();

  let { data } = await supabase
    .from("messages")
    .select("*")
    .or(
      `and(sender.eq.${currentUser},receiver.eq.${receiver}),and(sender.eq.${receiver},receiver.eq.${currentUser})`
    )
    .order("id", { ascending: true });

  messages.innerHTML = "";

  data.forEach(m => {
    messages.innerHTML += `
      <div class="msg">
        <b>${m.sender}:</b> ${m.message}
      </div>
    `;
  });
}
</script>

</body>
</html>
