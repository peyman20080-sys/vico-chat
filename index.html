<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vico Bot</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Vazirmatn', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c92d2);
    background-size:400% 400%;
    animation: bg 10s ease infinite;
    color:white;
}

@keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container{
    width:90%;
    max-width:420px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
    text-align:center;
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

.tag{
    font-size:14px;
    opacity:0.8;
    margin-bottom:20px;
}

.card{
    background:rgba(255,255,255,0.08);
    padding:15px;
    border-radius:15px;
    margin:10px 0;
}

.btn{
    display:block;
    margin-top:10px;
    padding:10px;
    border-radius:12px;
    text-decoration:none;
    color:white;
    background:linear-gradient(45deg,#00c6ff,#0072ff);
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.menu{
    position:absolute;
    top:15px;
    right:15px;
    font-size:24px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="menu">☰</div>

<div class="container">

    <h1>Vico Bot 🤖</h1>
    <div class="tag">ربات هوشمند روبیکا برای مدیریت و سرگرمی</div>

    <div class="card">
        <h3>📌 ربات Vico</h3>
        <p>این ربات برای ارائه خدمات هوشمند، پاسخگویی و امکانات ویژه ساخته شده است.</p>
        <a class="btn" href="https://rubika.ir/vicobot" target="_blank">ورود به ربات</a>
    </div>

    <div class="card">
        <h3>📢 کانال رسمی</h3>
        <p>برای دریافت آپدیت‌ها و اخبار ربات وارد کانال شوید.</p>
        <a class="btn" href="https://rubika.ir/vico_bot" target="_blank">عضویت در کانال</a>
    </div>

    <div class="card">
        <h3>👨‍💻 پشتیبانی</h3>
        <p>@peyman_m_1</p>
    </div>

</div>

</body>
</html>
